version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: tracestack-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tracestack
    volumes:
      - mongo_data:/data/db
    networks:
      - tracestack-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tracestack-server
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/tracestack
      PORT: 5000
      NODE_ENV: development
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - tracestack-network
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tracestack-client
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - tracestack-network
    command: npm start

volumes:
  mongo_data:

networks:
  tracestack-network:
    driver: bridge
